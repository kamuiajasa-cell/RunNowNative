d"><h2>Cara menghitung</h2><p class="sub" style="margin-top:-4px">Penjelasan angka yang tampil di aplikasi.</p>'+a("Arti istilah dasar","CTL = kebugaran: rata-rata beban latihanmu sekitar 6 minggu, naik pelan kalau kamu konsisten. ATL = kelelahan: beban sekitar 1 minggu terakhir, naik cepat setelah latihan berat. TSB (Form) = CTL dikurangi ATL: positif berarti segar, negatif berarti lelah. Sekitar 0 sampai +10 cocok untuk sesi kualitas, di bawah -20 sebaiknya santai atau istirahat. HR = detak jantung per menit. Pace = waktu per km (angka kecil berarti lebih cepat). Zona = tingkat usaha dari ringan sampai maksimal, berdasarkan HR atau pace.")+a("Pace inti, negative split, drift","Pace inti = rata-rata tanpa km pertama dan terakhir. Negative split positif berarti kamu makin cepat di akhir. Drift positif berarti HR naik pada pace yang sama (hanya dihitung untuk lari \u226530 menit).")+a("Decoupling detak jantung vs pace","Efisiensi = kecepatan per bpm. Dihitung untuk lari \u22652 km dengan data HR dan pace dari jam. Lari panjang dianalisis per km dan dinyatakan sebagai tren per jam; lari lebih pendek dibagi sekitar 8 segmen jarak sama, dan angkanya perbandingan paruh 2 vs paruh 1 (hasil indikatif). Untuk run-walk (kadens turun di bawah 135 spm = jalan), hanya blok lari yang dihitung; detik jalan dan 45 detik pertama tiap blok dibuang karena HR masih menyesuaikan, lalu hasil dibandingkan paruh 2 vs paruh 1 (di bawah 60 menit) atau sebagai tren per jam. Awal lari tidak dihitung karena HR masih menyesuaikan: km pertama untuk lari panjang, atau 20% durasi (maksimal 90 detik) untuk lari pendek. Garis tebal di grafik adalah efisiensi per km atau segmen (awal = 100), garis putus-putus adalah tren decoupling. Di atas 8% per jam dianggap peringatan. Lari di bawah 30 menit kurang andal.")+a("Beban latar harian","Langkah harian dikurangi langkah dari lari/jalan yang tercatat. Pembandingnya median 28 hari sebelumnya (butuh minimal 7 hari data). Di atas 10.000 langkah latar, atau 30% di atas kebiasaanmu (dan di atas 8.000), kesiapan dikoreksi turun maksimal 10 poin karena kaki sudah lelah sebelum sesi dimulai. Koreksi kemarin ikut terbawa 70% ke hari ini. Tanpa data langkah, pilihan manual Padat memberi \u22124 dan Sangat padat \u22128. Bila koreksi ini membuat sesi hari ini lebih ringan, alasannya tertulis di kartu Sesi hari ini.")+a("Recovery Velocity","Penurunan HR (bpm/dtk) di sekitar 30 detik pertama fase jalan. Fase jalan dikenali dari pace yang jatuh di bawah sekitar 62% kecepatan lari tipikal. Semakin besar bpm/dtk, semakin cepat jantung pulih.")+a("Zona HR dan pace","Zona HR dihitung dari persen HR maks. Zona pace dihitung dari pace threshold di Pengaturan; bila kosong, diperkirakan dari 1 km tercepatmu \xD7 1,12. Waktu berhenti tidak dihitung.")+a("Recovery","Rata-rata berbobot RHR 25%, HRV 30%, durasi tidur 25%, ditambah skor tidur, readiness, Baevsky SI, dan respirasi; semuanya dibandingkan baseline pribadi 28 hari. Zona aman: RHR naik \u2264 2 bpm (naik = lebih buruk, sama seperti peringatan Coach) dan HRV turun \u2264 8% tidak dipenalti. RHR dinilai dari 3 hari terakhir supaya lonjakan 1 hari tidak dianggap tren. Di luar zona aman, skor turun mulus. Bila satu faktor inti rendah, total dikalikan faktor koreksi 0,7\u20131,0, tanpa batas maksimum mutlak. Hijau \u2265 67, kuning 34\u201366, merah &lt; 34. Durasi tidur memakai tidur malam tadi; bila datanya kosong dihitung 0 jam.")+a("Sleep performance","Tidur hari ini = data tidur malam tadi (rekaman wellness bertanggal hari ini). Bila kosong, dihitung 0 jam kapan pun dan performanya 0%, tanpa memakai data kemarin. Performa = durasi 45% + konsistensi 35% + skor perangkat 20% (bobot disesuaikan bila ada yang kosong). Durasi \u2265 92% kebutuhan dianggap penuh. Konsistensi memakai simpangan robust (MAD) 7 malam, jadi begadang satu malam tidak langsung menjatuhkan skor. Skor perangkat dipakai sebagai wakil kualitas tidur nyenyak karena fase REM/Deep dan jam tidur-bangun tidak ada di data. Utang tidur hanya dihitung 4 malam terakhir, dan tambahan tidur malam ini maksimal 1 jam. Hijau \u2265 85, kuning 70\u201384, merah &lt; 70.")+a("Strain","Strain = 21 \xD7 (1 \u2212 e^(\u2212beban \xF7 kapasitas)). Beban = beban latihan (TRIMP, atau load Intervals bila ada) + langkah di luar sesi lari \xD7 0,0028 (maks 45 poin, agar jalan kaki harian tidak disamakan dengan sesi berat). Kapasitas = 60 + 1,6 \xD7 CTL rata-rata 7 hari (dihaluskan agar tidak melonjak atau merosot tiba-tiba), jadi sesi yang sama terasa lebih berat bagi yang kurang bugar. Target = 7 + 11 \xD7 pemulihan gabungan (Recovery 50%, tidur 20%, check-in 15%, cedera 15%), dikurangi bila rasio beban 7:28 hari di atas 1,3 atau Form rendah, dan dibatasi maks 5 bila kesiapan di bawah 50.")+"</div>"}function aboutCard(){return'<div class="card"><h2>Tentang RunSense</h2><p class="sub" style="margin-top:-4px">Aplikasi pemantau beban latihan lari: kebugaran (CTL), kelelahan (ATL), dan kesiapan (TSB), dengan rencana latihan dan analisis zona. Data lari diimpor dari Strava atau Intervals.icu. Semua data disimpan di perangkat ini, tidak di server.</p><p class="sub" style="margin:8px 0 0"><b>Lisensi:</b> MIT. Bebas dipakai, disalin, dan diubah dengan tetap mencantumkan pemberitahuan hak cipta.</p><p class="sub" style="margin:8px 0 0"><b>Kredit:</b> Font dari Google Fonts (lisensi SIL Open Font License). Strava dan Intervals.icu adalah merek dagang pemiliknya masing-masing dan tidak berafiliasi dengan aplikasi ini.</p></div>'}function skinCard(){const a=document.documentElement.dataset.theme=="dark"?3:2;return`<div class="card"><h2>Tampilan & font</h2><p class="sub" style="margin:-4px 0 14px">Pilih mode warna dan tema. Setiap tema punya versi terang dan gelap, lengkap dengan fontnya sendiri. Tersimpan di perangkat ini. Tema lain yang pernah kamu pilih tetap tampil selama masih aktif.</p><div class="mode-seg" role="group" aria-label="Mode warna">${[["","Otomatis"],["light","Terang"],["dark","Gelap"]].map(t= il dan nikmati satu kilometer demi satu kilometer.","Jangan lupa minum dan tersenyum. Kamu lebih siap dari yang kamu kira.","Percayalah pada latihan yang sudah kamu jalani. Kakimu tahu jalannya.","Hari ini kamu menabung kekuatan untuk minggu-minggu ke depan. Semangat!","Biarkan pikiranmu mengembara selama kakimu berlari. Selamat menikmati perjalanan.","Sabar di awal, nanti kamu berterima kasih pada dirimu sendiri di akhir."],hard:["Sesi inti hari ini menantang, tapi kamu lebih siap dari yang kamu kira. Semangat!","Rasa lelah sebentar itu tanda kamu sedang bertumbuh. Jaga napas dan bentuk larimu.","Pemanasan yang baik adalah separuh keberhasilan. Kamu pasti bisa!","Beri yang terbaik di bagian inti, lalu nikmati pendinginan yang tenang.","Berani keluar dari zona nyaman hari ini. Kamu lebih kuat dari yang kamu sangka.","Fokus pada satu repetisi saja, lalu satu lagi. Kamu sedang melakukannya dengan baik.","Boleh terasa berat, asal napas tetap terkendali. Kamu hebat!","Hari ini kamu mengetuk batas dengan hormat. Kamu pantas bangga."],slow:["Kombinasi lari dan jalan hari ini sudah cukup. Merawat diri juga bagian dari berlatih.","Tidak apa-apa bergerak lebih pelan. Yang penting kamu menjaga dirimu.","Dengarkan tubuhmu, berhenti bila perlu. Kamu tetap pelari yang hebat.","Kemenangan hari ini: bergerak dengan nyaman dan aman."],rest:["Istirahat juga latihan. Tubuhmu sedang bekerja diam-diam untuk jadi lebih kuat.","Hari ini giliran kakimu dimanjakan. Tidur cukup, minum air, dan tersenyumlah.","Tidak berlari hari ini bukan berarti berhenti. Kamu sedang mengisi tenaga.","Izinkan dirimu santai tanpa rasa bersalah. Kamu sudah bekerja keras.","Besok kamu akan berterima kasih pada istirahat hari ini.","Hari tenang untuk tubuh dan pikiran. Nikmati teh hangat dan kaki yang rileks.","Pelari yang bijak tahu kapan harus beristirahat. Kamu salah satunya.","Kekuatan tumbuh saat kita pulih. Hari ini waktunya tumbuh."],done:["Terima kasih sudah menepati janji pada dirimu sendiri hari ini.
