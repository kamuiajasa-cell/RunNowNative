<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Pengaturan</title>
<style>
:root{--bg:#f2f4f8;--cd:#ffffff;--tx:#0b0d12;--pr:#0077c8;--ok:#12b76a;--wn:#c47a06;--bad:#d4372f;
--mt:color-mix(in srgb,var(--tx) 66%,var(--bg));--ln:color-mix(in srgb,var(--tx) 12%,var(--bg));
--ps:color-mix(in srgb,var(--pr) 14%,var(--cd));--el:color-mix(in srgb,var(--tx) 5%,var(--cd));--r:18px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--ok:#32d583;--wn:#fdb022;--bad:#ff6b6b;color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;max-width:560px;padding:0 14px 40px;background:var(--bg);color:var(--tx);
font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--pr);outline-offset:2px}

#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:6px;
padding:10px 0;background:var(--bg)}
#back{width:44px;height:44px;border-radius:50%;background:var(--cd);border:1px solid var(--ln);font-size:26px;line-height:1;
display:grid;place-items:center;padding-bottom:3px}
#ttl{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.2}

.sheet{background:var(--cd);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden}
.sub{color:var(--mt);font-size:14px;margin:0 2px 14px}

/* daftar kelompok */
.go{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 16px;text-align:left;border-top:1px solid var(--ln)}
.go:first-child{border-top:0}
.go .t{flex:1;min-width:0}
.go b{display:block;font-size:16px}
.go small{display:block;color:var(--mt);font-size:13px;line-height:1.35;margin-top:2px}
.go:after{content:"";flex:none;width:9px;height:9px;border-right:2.5px solid var(--mt);border-top:2.5px solid var(--mt);transform:rotate(45deg)}

/* baris pengaturan */
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 16px;border-top:1px solid var(--ln);min-height:56px}
.row:first-child{border-top:0}
.row.col{flex-direction:column;align-items:stretch;gap:10px}
.lb{flex:1;min-width:0}
.lb b{display:block;font-weight:700;font-size:15px}
.lb small{display:block;color:var(--mt);font-size:13px;line-height:1.35;margin-top:2px}
.note{padding:12px 16px;border-top:1px solid var(--ln);font-size:14px;color:var(--mt)}
.note.warn{color:var(--wn)}
.note.err{color:var(--bad)}

input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:50px;height:30px;border-radius:99px;margin:0;
background:var(--ln);position:relative;transition:background .2s}
input[type=checkbox]:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;
box-shadow:0 1px 3px #0004;transition:left .2s}
input[type=checkbox]:checked{background:var(--pr)}
input[type=checkbox]:checked:after{left:23px}
select,input[type=number],input[type=text],input[type=password]{min-height:46px;padding:9px 12px;border:1.5px solid var(--ln);border-radius:14px;
background:var(--bg);font-weight:600;max-width:100%}
select{flex:none;min-width:128px}
input[type=number],input[type=text],input[type=password]{width:100%}
.inline{display:flex;gap:8px;align-items:center}
.btn{min-height:46px;padding:10px 16px;border-radius:14px;background:var(--pr);color:var(--cd);font-weight:700;text-align:center}
:root[data-theme=dark] .btn{color:var(--bg)}
.btn.g{background:var(--el);color:var(--tx);border:1px solid var(--ln)}
.btn.dg{background:var(--bad);color:#fff}
.btn:disabled{opacity:.6}
.btn.sm{flex:none}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.frm{display:flex;flex-direction:column;gap:8px}
.fld{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px}
.fld span{flex:1;min-width:0;font-size:14px;font-weight:600}
.fld input[type=number],.fld select{width:132px;flex:none;min-width:0}
textarea{width:100%;min-height:170px;padding:9px 12px;border:1.5px solid var(--ln);border-radius:14px;background:var(--bg);
font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.btns .btn{flex:1;min-width:120px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{min-width:40px;min-height:40px;padding:0 6px;border-radius:12px;border:1.5px solid var(--ln);background:var(--bg);font-weight:700;font-size:13px}
.days button.on{background:var(--pr);color:var(--cd);border-color:var(--pr)}
:root[data-theme=dark] .days button.on{color:var(--bg)}
input[type=time]{flex:none;min-height:46px;padding:9px 12px;border:1.5px solid var(--ln);border-radius:14px;background:var(--bg);font-weight:600}
textarea.pl{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:150px}

.stp{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--ln);border-radius:14px;background:var(--bg)}
.grp{display:flex;flex-direction:column;gap:8px;padding:10px;border:1.5px solid var(--ln);border-radius:16px}
.stp .inline select{flex:1;min-width:0}
#m.busy .row,#m.busy .go{opacity:.6;pointer-events:none}
#toast{position:fixed;left:14px;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:532px;margin:0 auto;z-index:20;
padding:12px 16px;border-radius:14px;background:var(--tx);color:var(--bg);font-size:14px;font-weight:600;display:none}
#toast.err{background:var(--bad);color:#fff}
.load{padding:24px 16px;color:var(--mt)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header id="bar">
  <button id="back" type="button" aria-label="Kembali">&#8249;</button>
  <h1 id="ttl">Pengaturan</h1>
</header>
<main id="m"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- tema: sama dengan index.html (localStorage "la2" satu origin) ---------- */
/* Palet 26 tema: [terang, gelap], masing-masing [latar, kartu, teks, aksen]. Urutan sama dengan SKINS di index.html. */
var PALET = [[["#f5f2eb","#ffffff","#1b2b29","#0f766e"],["#0e1514","#162220","#e6f0ee","#2dd4bf"]],[["#e8e8e6","#f6f6f4","#0b0b0b","#d71921"],["#000000","#121212","#f4f4f2","#ff3b30"]],[["#f4f0e8","#fffaf0","#29251f","#b85c38"],["#1a1612","#241e18","#f1e9dc","#e08a63"]],[["#e8f1fb","#ffffff","#0b2540","#0a7fd4"],["#071b33","#102746","#eaf4ff","#42b7ff"]],[["#f1effc","#ffffff","#241f45","#6d4bd0"],["#101827","#1b2638","#e8f0ff","#9d8cff"]],[["#fff5f6","#ffffff","#482b36","#e65385"],["#1f1218","#2b1a22","#ffe9f0","#ff7aa5"]],[["#f0f5ef","#ffffff","#203b2a","#36834b"],["#0e1a12","#16261b","#e3f2e7","#5fd07f"]],[["#fff8e7","#fffdf6","#493d1d","#b18b00"],["#1a1608","#262011","#f6ecc8","#f0c53a"]],[["#f5effa","#ffffff","#2d2038","#8f43c9"],["#17131f","#251d30","#f4eaff","#d08aff"]],[["#f3f6fa","#ffffff","#182536","#3164cc"],["#0d141f","#162131","#e8f0fb","#6b9bff"]],[["#f6f2ee","#ffffff","#211a15","#d6481a"],["#151515","#202020","#f5f5f5","#ff6b35"]],[["#f7f0ff","#ffffff","#35244b","#8654cf"],["#1a1326","#261b36","#efe6ff","#b58cff"]],[["#eafaff","#ffffff","#123944","#009db8"],["#0a1c22","#112b33","#dff7fc","#2fd4ee"]],[["#f8f8f8","#ffffff","#202020","#c62828"],["#121212","#1c1c1c","#f2f2f2","#ff5a5a"]],[["#eef8f5","#ffffff","#12332c","#0f9f78"],["#101f1d","#182d29","#e8fff8","#4ce0b0"]],[["#fff4e9","#ffffff","#4c2c1b","#e16b2e"],["#1c120b","#2a1c13","#ffeadb","#ff9250"]],[["#f1f0ea","#ffffff","#20231e","#606c38"],["#141610","#1e211a","#eceee3","#a3b86a"]],[["#eef2fb","#ffffff","#142038","#3a63d1"],["#0d1528","#18233d","#eef3ff","#6f9cff"]],[["#fdf0f1","#ffffff","#47232b","#b51f4a"],["#1d1114","#2a1a1e","#fbe6ea","#ef6a8c"]],[["#e9f1ff","#f9fbff","#162e55","#3158d5"],["#0c1730","#142343","#e6eeff","#7aa0ff"]],[["#f7f4e6","#fffdf2","#2a2610","#a77d00"],["#15151a","#222229","#f2f2f7","#ffcf4a"]],[["#f3f0e9","#fffdf8","#25231e","#347d70"],["#181a19","#222524","#eeede8","#5cbfaa"]],[["#f1f5f9","#ffffff","#1f2937","#475569"],["#0f141a","#18202a","#e5eaf0","#9fb3c8"]],[["#fbeffa","#ffffff","#3a1840","#c4249b"],["#1b1024","#291833","#fff0ff","#ff65d4"]],[["#f0fff4","#ffffff","#17432c","#15803d"],["#0c1a12","#14271b","#e2fbe9","#4ade80"]],[["#f2f4f8","#ffffff","#0b0d12","#0077c8"],["#0a0a0c","#121318","#ffffff","#00f0ff"]]];
(function () {
  var s = {};
  try { s = JSON.parse(localStorage.getItem("la2") || "{}"); } catch (e) {}
  var th = s.th || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
  var i = Math.max(1, Math.min(26, Number(s.skin) || 26)) - 1;
  var c = PALET[i][th === "dark" ? 1 : 0];
  var st = document.documentElement.style;
  st.setProperty("--bg", c[0]); st.setProperty("--cd", c[1]); st.setProperty("--tx", c[2]); st.setProperty("--pr", c[3]);
  document.documentElement.dataset.theme = th;
})();

/* ---------- jembatan ke aplikasi: sama dengan rn() di index.html ---------- */
function rn(method, args, timeout) {
  return new Promise(function (res, rej) {
    var h = window.ReactNativeWebView;
    if (!h || !h.postMessage) { rej(new Error("Pengaturan jam hanya bisa diubah dari aplikasi.")); return; }
    rn.p = rn.p || {};
    var id = rn.n = (rn.n || 0) + 1;
    var t = setTimeout(function () { delete rn.p[id]; rej(new Error("Tidak ada jawaban dari aplikasi.")); }, timeout || 20000);
    rn.p[id] = { res: res, rej: rej, t: t };
    h.postMessage(JSON.stringify({ type: "rpc", id: id, method: method, args: args || [] }));
  });
}
window.__rn = function (id, ok, v) {
  var e = rn.p && rn.p[id];
  if (!e) return;
  delete rn.p[id]; clearTimeout(e.t);
  if (ok) e.res(v); else e.rej(new Error(String(v)));
};
window.__hrvTick = function (n) {
  var e = document.getElementById("hrvt");
  if (e) e.textContent = "Sisa " + n + " detik. Tetap diam.";
};

/* ---------- TABEL PENGATURAN ----------
   Satu kelompok = satu entri di G. Satu pengaturan = satu objek di items. Menambah pengaturan = menambah satu objek.

   Kelompok: id (alamat: pengaturan.html#id; daftarkan juga di Routes.kt), title, sub,
     load: { kunci: "namaMetodeGet" }  status yang dibaca saat kelompok dibuka; hasilnya ada di s.kunci
   Item (semua properti teks boleh berupa fungsi (s) => teks):
     t       jenis: switch | select | number | text | button | buttons | note | hrv
     need    daftar kunci load yang harus berhasil dibaca; kalau gagal, item disembunyikan
     vis     (s) => boolean, tampil bila true
     label, hint
     val     (s) => nilai sekarang                 (switch, select, number, text)
     m       nama metode untuk menyimpan; pre: argumen di depan nilai; into: kunci load yang diganti jawabannya;
             reload: baca ulang semua status setelah berhasil; timeout (ms); done: pesan berhasil
     opts    [[nilai, teks], ...]; num: ubah nilai pilihan ke angka     (select)
     min, max, off   batas angka; off = teks bantuan bila kosong        (number)
     ph, btn         isi bantuan dan teks tombol                        (text)
     args            argumen tetap                                      (button)
     plain           tombol sekunder                                    (button)
     list            [{label, m, args, done}]                           (buttons)
   Tambahan langkah 4:
     t: "form"      beberapa isian dalam satu simpan. fields: [{k, t: number|select|check, label, val:(s)=>nilai, min, max, step, opts}];
                     pack: (nilai {k: isi}) => satu argumen yang dikirim ke m; btn: teks tombol
     t: "report"    tombol buat laporan dukungan (getSupportReport), kotak teks, dan tombol salin
     select: nul     nilai pilihan yang dikirim sebagai null (mis. "auto")
     button: confirm teks tombol pada ketukan pertama; perlu ketukan kedua dalam 5 detik; danger: tombol merah
     done            boleh fungsi (s, jawaban) => teks
   Tambahan langkah 5:
     t: "apps"      daftar aplikasi berisi saklar, dengan kotak cari. src: kunci load berisi [{packageName,label,enabled}]; m: metode (nama paket, nyala).
                     Tiap saklar disimpan sendiri tanpa memuat ulang halaman.
     t: "lines"     kotak teks, satu isi per baris, dikirim sebagai satu daftar. val:(s)=>daftar; max, len (angka atau fungsi (s)); ph, btn
     t: "alarms"    editor alarm jam (5 slot + alarm pintar). src: kunci load berisi hasil getAlarms; m: setAlarms; into: kunci yang sama
   Tambahan langkah 6:
     t: "agps"      status data satelit dengan tombol Perbarui dan Batal; memantau getAgps tiap detik sendiri (tidak lewat save, supaya Batal bisa diketuk). src: kunci load berisi getAgps
     t: "course"    editor program lari (grup, langkah, target, usaha); draf disimpan di localStorage[\"rn_course_draft\"]. m: pushRunningCourse; timeout; done
     text: val      isi awal kotak teks (fungsi (s) => teks)
   Tambahan langkah 7:
     t: "faces"     daftar wajah jam di jam (Aktifkan, Hapus). src: kunci load berisi hasil listWatchfaces
     t: "facepick"  pilih berkas .hwt, pratinjau, dan Pasang ke jam. src: kunci load getPickedWatchface; wf: kunci load listWatchfaces (cek ukuran layar)
     t: "photos"    foto jam: kisi foto, Tambah (pemilih berkas), Hapus, Aktifkan wajah foto. src: kunci load berisi hasil getPhotoFace
     t: "facecustom" baca dan ubah pilihan wajah (gaya, warna, widget). src: kunci load berisi hasil listWatchfaces
   Tambahan langkah 8 dan 9:
     t: "hwimport"  impor ZIP ekspor Huawei (pilih berkas, kata sandi, progres lewat window.__hwTick, ringkasan, Batal). src: kunci load getHuaweiExport
     t: "music"     lagu di jam: baca daftar, Tambah lagu (pilih berkas lalu kirim, progres lewat window.__upTick), Hapus. src: kunci load getWatchMusic
   Tambahan langkah 8: buttons.list boleh fungsi (s) => [{label, m, args, done, reload}]; form.spread: pack mengembalikan daftar argumen (bukan satu objek)
*/
/* ---------- Langkah 6: pembantu data satelit (A-GPS) ---------- */
var AGPS_TXT = {
  never: "Jam belum pernah mengambil data satelit dari aplikasi ini.",
  delivered: "Jam sudah punya data satelit terbaru.",
  deliveredLab: "Jam sudah menerima data satelit eksperimen (HW_AGNSS). Belum terbukti dipakai jam; catat waktu GPS menemukan posisi.",
  deliveredPgnss: "Jam sudah menerima data satelit prediksi eksperimen (HW_PGNSS_PRED, 3 hari). Belum terbukti dipakai jam; catat waktu GPS menemukan posisi.",
  expired: "Data satelit di jam sudah kedaluwarsa. Ketuk Perbarui sekarang.",
  stored: "Data sudah diunduh ke HP ini. Data dikirim ke jam saat jam terhubung dan memintanya.",
  watchSilent: "Data sudah siap di HP ini, tetapi jam tidak menanggapi. Data dikirim saat jam memintanya.",
  noNetwork: "HP ini tidak punya internet. Coba lagi saat sudah tersambung.",
  downloadFailed: "Data satelit gagal diunduh.",
  invalidFile: "Yang terunduh bukan data satelit yang valid, jadi tidak dikirim ke jam.",
  unsupported: "Jam butuh data satelit yang hanya bisa disiapkan aplikasi Huawei sendiri, dan aplikasi ini tidak bisa menyediakannya.",
  watchRefused: "Jam tidak ikut dalam pertukaran ini. Pembaruan dimulai dari jam sendiri.",
  timeout: "Pengiriman ke jam berhenti di tengah jalan, jadi dibatalkan.",
  cancelled: "Pembaruan dibatalkan.",
  busy: "Pembaruan sedang berjalan.",
  linkLost: "Koneksi ke jam terputus saat pembaruan.",
  asking: "Menanyakan jam\u2026",
  downloading: "Mengunduh data satelit\u2026",
  waiting: "Data siap, menunggu jam mengambilnya\u2026",
  sending: "Mengirim ke jam\u2026"
};
var AGPS_OUT = {
  none: ["never", "info"], delivered: ["delivered", "ok"], stored: ["stored", "info"], watch_silent: ["watchSilent", "info"],
  no_network: ["noNetwork", "danger"], download_failed: ["downloadFailed", "danger"], invalid_file: ["invalidFile", "danger"],
  unsupported: ["unsupported", "info"], watch_refused: ["watchRefused", "danger"], timeout: ["timeout", "danger"],
  cancelled: ["cancelled", "info"], busy: ["busy", "info"], link_lost: ["linkLost", "danger"]
};
/* Sama dengan agpsView() di JoyoFit (features/device/agps.ts), tanpa bagian yang menyembunyikan baris. */
function agpsView(a, now) {
  var busy = a.phase !== "idle";
  function deliveredKey(src) { return src === "joyofit_rtcm" ? "deliveredLab" : src === "joyofit_pgnss" ? "deliveredPgnss" : "delivered"; }
  var expired = a.expiresAt > 0 && now >= a.expiresAt;
  var labDel = ((a.deliveredSource === "joyofit_rtcm" && a.labAgnss) || (a.deliveredSource === "joyofit_pgnss" && a.labPgnss)) &&
    a.deliveredAt > 0 && (a.expiresAt === 0 || now < a.expiresAt);
  var key, tone;
  if (busy) {
    key = { asking: "asking", downloading: "downloading", waiting: "waiting", sending: "sending" }[a.phase] || "asking"; tone = "info";
  } else if (expired && (a.outcome === "delivered" || a.outcome === "none")) {
    key = "expired"; tone = "danger";
  } else if (a.outcome === "unsupported" && labDel) {
    key = deliveredKey(a.deliveredSource); tone = "ok";
  } else {
    var k = AGPS_OUT[a.outcome] || AGPS_OUT.none;
    key = k[0] === "delivered" ? deliveredKey(a.deliveredSource) : k[0]; tone = k[1];
  }
  var size = a.deliveredSize > 0 ? a.deliveredSize : a.cachedSize;
  return {
    busy: busy, key: key, tone: tone,
    text: AGPS_TXT[key] + (tone === "danger" && a.error ? " " + a.error : ""),
    last: a.deliveredAt > 0 ? new Date(a.deliveredAt).toLocaleString("id-ID") : "belum pernah",
    kb: size > 0 ? Math.max(1, Math.round(size / 1024)) + " KB" : "-",
    phone: a.cachedAt > 0 ? new Date(a.cachedAt).toLocaleString("id-ID") : "-",
    asked: a.lastAskAt > 0 ? (a.lastAskTags ? String(a.lastAskTags).split(",").join(", ") : "v" + a.lastAskVersion) : "belum ada",
    retry: !busy && a.retryAt > now ? new Date(a.retryAt).toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" }) : ""
  };
}
function agoText(ms) {
  if (!ms) return "belum";
  var m = Math.max(0, Math.round((Date.now() - ms) / 60000));
  return m < 1 ? "baru saja" : m < 90 ? m + " menit lalu" : m < 2880 ? Math.round(m / 60) + " jam lalu" : Math.round(m / 1440) + " hari lalu";
}

/* ---------- Langkah 6: draf program lari (disimpan di HP, kunci sendiri) ---------- */
var CD_KEY = "rn_course_draft";
var CD = null;
function cdStep(o) {
  var s = { kind: "run", target: "time", a: "5", b: "0", unit: "km", intensity: "none", p1: "", p2: "", p3: "", p4: "", lo: "", hi: "" };
  for (var k in o) s[k] = o[k];
  return s;
}
function cdLoad() {
  if (CD) return CD;
  try { var j = JSON.parse(localStorage.getItem(CD_KEY) || "null"); if (j && typeof j.name === "string" && Array.isArray(j.blocks)) CD = j; } catch (e) {}
  return CD || (CD = { name: "", blocks: [] });
}
function cdSave() { try { localStorage.setItem(CD_KEY, JSON.stringify(CD)); } catch (e) {} }
var CD_PRESETS = {
  easy: function () {
    return { name: "Santai 20 mnt", blocks: [
      { repeat: 1, steps: [cdStep({ kind: "warmup", a: "5" })] },
      { repeat: 1, steps: [cdStep({ kind: "run", a: "20" })] },
      { repeat: 1, steps: [cdStep({ kind: "cooldown", a: "5" })] }] };
  },
  intervals: function () {
    return { name: "Interval", blocks: [
      { repeat: 1, steps: [cdStep({ kind: "warmup", a: "10" })] },
      { repeat: 6, steps: [cdStep({ kind: "run", target: "distance", a: "400", unit: "m", intensity: "pace", p1: "5", p2: "0", p3: "5", p4: "30" }),
                           cdStep({ kind: "rest", a: "1", b: "30" })] },

function cdBuild(d) {
  var name = (d.name || "").trim();
  if (!name) return { err: "Beri nama pada program." };
  if (unescape(encodeURIComponent(name)).length > 64) return { err: "Nama program terlalu panjang (paling banyak 64 byte)." };
  if (!d.blocks.length) return { err: "Tambahkan minimal satu langkah." };
  var count = 0, blocks = [];
  function whole(t) { t = String(t).trim(); return /^\d{1,9}$/.test(t) ? Number(t) : null; }
  function wholeOrZero(t) { return String(t).trim() === "" ? 0 : whole(t); }
  for (var i = 0; i < d.blocks.length; i++) {
    var b = d.blocks[i], steps = [], lb = "Grup " + (i + 1);
    if (!b.steps.length) return { err: lb + ": tambahkan langkah ke grup ini." };
    if (!(b.repeat >= 1 && b.repeat <= 99)) return { err: lb + ": grup diulang 1 sampai 99 kali." };
    count += b.steps.length;
    if (count > 100) return { err: "Program paling banyak punya 100 langkah." };
    for (var j = 0; j < b.steps.length; j++) {
      var s = b.steps[j], at = lb + ", langkah " + (j + 1) + ": ";
      var tv = 0, low = 0, high = 0;
      if (s.target === "time") {
        var mi = wholeOrZero(s.a), se = wholeOrZero(s.b);
        if (mi === null || se === null || se > 59) return { err: at + "detik 0 sampai 59, menit berupa bilangan bulat." };
        tv = mi * 60 + se;
        if (tv < 1 || tv > 86400) return { err: at + "target waktu 1 detik sampai 24 jam." };
      } else if (s.target === "distance") {
        var dv = Number(String(s.a).trim().replace(",", "."));
        if (!/^(\d+\.?\d*|\.\d+)$/.test(String(s.a).trim().replace(",", "."))) return { err: at + "masukkan jarak sebagai angka." };
        tv = Math.round(s.unit === "km" ? dv * 1000 : dv);
        if (tv < 1 || tv > 100000) return { err: at + "target jarak 1 m sampai 100 km." };
      }
      if (s.intensity === "pace") {
        var f1 = wholeOrZero(s.p1), f2 = wholeOrZero(s.p2), s1 = wholeOrZero(s.p3), s2 = wholeOrZero(s.p4);
        if (f1 === null || f2 === null || s1 === null || s2 === null || f2 > 59 || s2 > 59) return { err: at + "detik kecepatan 0 sampai 59, menit berupa bilangan bulat." };
        low = f1 * 60 + f2; high = s1 * 60 + s2;
        if (low < 60 || low > 900 || high < 60 || high > 900) return { err: at + "batas kecepatan 1:00 sampai 15:00 per km." };
        if (low > high) return { err: at + "kecepatan yang lebih cepat harus berupa waktu yang lebih kecil." };
      } else if (s.intensity === "hrPercent" || s.intensity === "cadence") {
        var lo = whole(s.lo), hi = whole(s.hi), hr = s.intensity === "hrPercent";
        if (lo === null || hi === null) return { err: at + (hr ? "isi kedua batas detak jantung." : "isi kedua batas kadensi.") };
        if (hr ? (lo < 20 || lo > 100 || hi < 20 || hi > 100) : (lo < 100 || lo > 300 || hi < 100 || hi > 300)) {
          return { err: at + (hr ? "batas detak jantung 20 sampai 100 % dari maksimum." : "batas kadensi 100 sampai 300 langkah per menit.") };
        }
        if (lo > hi) return { err: at + (hr ? "detak jantung yang lebih rendah harus di depan." : "kadensi yang lebih rendah harus di depan.") };
        low = lo; high = hi;
      }
      steps.push({ kind: s.kind, target: s.target, targetValue: tv, intensity: s.intensity, low: low, high: high });
    }
    blocks.push({ repeat: b.repeat, steps: steps });
  }
  return { course: { name: name, blocks: blocks } };
}

  row.appendChild(el("small", "", "Layar jam " + ph.width + " x " + ph.height + ". " + n + (ph.maxPhotos > 0 ? " dari " + ph.maxPhotos : "") + " foto.")).style.color = "var(--mt)";
  if (ph.applyError) row.appendChild(el("small", "", ph.applyError)).style.color = "var(--wn)";
  var grid = el("div", "btns");
  ph.photos.forEach(function (x) {
    var c = el("div", "stp"); c.style.flex = "1 1 140px";
    if (x.thumb) {
      var im = el("img"); im.src = x.thumb; im.alt = "Foto " + (x.index + 1);
      im.style.cssText = "width:100%;max-height:160px;object-fit:contain;border-radius:10px;background:#000";
      c.appendChild(im);
    } else {
      c.appendChild(el("small", "", "Foto " + (x.index + 1) + " (pratinjau tidak tersedia; foto ini bukan dari HP ini).")).style.color = "var(--mt)";
    }
    c.appendChild(confirmBtn("Hapus", "Ketuk lagi", function () { act(g, "deletePhoto", [x.name], "Foto dihapus.", 120000); }));
    grid.appendChild(c);
  });
  if (n) row.appendChild(grid);
  var full = ph.maxPhotos > 0 && n >= ph.maxPhotos;
  var box = el("div", "btns");
  var add = btn(full ? "Foto sudah penuh" : "Tambah foto", "", function () {
    act(g, "addPhoto", [], function (s, r) { return r && r.applyError ? "Foto ditambah, tetapi " + r.applyError : "Foto ditambahkan."; }, 180000);
  });
  add.disabled = full;
  box.appendChild(add);
  if (ph.face && !ph.face.active) box.appendChild(btn("Aktifkan wajah foto", "g", function () { act(g, "setPhotoFaceActive", [], "Wajah foto diaktifkan.", 60000); }));
  row.appendChild(box);
  return row;
};

KIND.facecustom = function (g, it) {
  var w = S[it.src], row = el("div", "row col"), cfg = null;
  row.appendChild(labelBox(it));
  var faces = w.faces.filter(function (f) { return !f.photo && !f.video; });
  if (!faces.length) { row.appendChild(el("small", "", "Tidak ada wajah jam yang bisa disesuaikan.")).style.color = "var(--mt)"; return row; }
  var sel = el("select"); sel.setAttribute("aria-label", "Pilih wajah jam"); sel.style.width = "100%";
  faces.forEach(function (f) {
    var op = el("option", "", (f.name || f.id) + (f.active ? " (aktif)" : "")); op.value = f.id;
    if (f.active) op.selected = true;
    sel.appendChild(op);
  });
  row.appendChild(sel);
  var box = el("div", "frm");
  function field(label, type, val, on, max) {
    var line = el("label", "fld"); line.appendChild(el("span", "", label));
    var c = el("input"); c.type = type; if (type === "number") { c.inputMode = "numeric"; c.min = 0; c.max = max; }
    c.value = val == null ? "" : val; c.style.width = "132px"; c.setAttribute("aria-label", label);
    c.onchange = function () { on(c.value.trim()); };
    line.appendChild(c); box.appendChild(line);
  }
  function whole(v, max) { var n = Number(v); return v !== "" && isFinite(n) && Math.floor(n) === n && n >= 0 && n <= max ? n : null; }
  function draw() {
    box.textContent = "";
    if (!cfg) return;
    var any = false;
    cfg.styles.forEach(function (s) {
      any = true; field((MODE_NAMA[s.mode] || "Mode " + s.mode) + " (nomor)", "number", s.index, function (v) { var n = whole(v, 255); if (n != null) s.index = n; }, 255);
    });
    if (cfg.colourIndex != null) { any = true; field("Warna (nomor)", "number", cfg.colourIndex, function (v) { var n = whole(v, 255); if (n != null) cfg.colourIndex = n; }, 255); }
    if (cfg.customColour != null) { any = true; field("Warna sendiri", "text", cfg.customColour, function (v) { cfg.customColour = v; }); }
    cfg.widgets.forEach(function (x, i) {
      any = true; field("Widget " + (i + 1) + " (nomor)", "number", x, function (v) { var n = whole(v, 255); if (n != null) cfg.widgets[i] = n; }, 255);
    });
    if (!any) { box.appendChild(el("small", "", "Wajah ini tidak melaporkan pilihan yang bisa diubah.")).style.color = "var(--mt)"; return; }
    box.appendChild(btn("Terapkan ke jam", "", function () {
      if (busy) return;
      setBusy(true);
      rn("applyFaceCustomization", [cfg], 60000).then(function (r) {
        if (r && r.config) cfg = r.config;
        toast(r && r.message ? r.message : "Terkirim.", !(r && r.ok));
        draw();
      }).catch(function (e) { toast(e.message, true); }).then(function () { setBusy(false); });
    }));
  }
  var rd = btn("Baca pilihan dari jam", "g", function () {
    if (busy) return;
    setBusy(true);
    rn("getFaceCustomization", [sel.value], 30000).then(function (r) { cfg = r; draw(); })
      .catch(function (e) { cfg = null; draw(); toast(e.message, true); }).then(function () { setBusy(false); });
  });
  sel.onchange = function () { cfg = null; draw(); };
  row.appendChild(rd); row.appendChild(box);
  return row;
};

/* Alamat server: dibaca dan disimpan langsung lewat window.RunNowServer (bukan lewat rn). */
KIND.serverurl = function (g, it) {
  var S2 = window.RunNowServer;
  var row = el("div", "row col");
  if (!S2) { row.appendChild(el("small", "", "Pengaturan alamat server hanya bisa diubah dari aplikasi.")).style.color = "var(--mt)"; return row; }
  var cur = S2.get(), def = S2.defaultUrl();
  var lb = el("div", "lb"); lb.appendChild(el("b", "", "URL Run Now"));
  var hint = el("small", "", cur === def ? "Sekarang: URL bawaan." : "Sekarang: " + cur);
  lb.appendChild(hint); row.appendChild(lb);
  var line = el("div", "inline");
  var inp = el("input"); inp.type = "text"; inp.inputMode = "url"; inp.autocomplete = "off"; inp.autocapitalize = "none"; inp.spellcheck = false;
  inp.placeholder = def; inp.value = cur; inp.setAttribute("aria-label", "URL Run Now");
  var b = el("button", "btn sm", "Simpan"); b.type = "button";
  line.appendChild(inp); line.appendChild(b); row.appendChild(line);
  function apply(url, msg) {
    inp.value = url;
    hint.textContent = url === def ? "Sekarang: URL bawaan." : "Sekarang: " + url;
    toast(msg);
  }
  b.onclick = function () {
    var url = S2.save(inp.value);
    if (!url) { toast("URL tidak valid. Contoh: https://contoh.workers.dev", true); inp.focus(); return; }
    apply(url, "Tersimpan. Kembali ke halaman utama untuk memuat URL baru.");
  };
  var r = el("button", "btn g", "Kembalikan ke URL bawaan"); r.type = "button";
  r.onclick = function () { apply(S2.reset(), "Kembali ke URL bawaan."); };
  row.appendChild(r);
  row.appendChild(el("small", "", "Tanpa https:// akan ditambahkan otomatis. http:// (mis. server di jaringan lokal) juga bisa.")).style.color = "var(--mt)";
  return row;
};

/* Nama, ikon, splash, dan badge dari manifest server: diambil dan disimpan aplikasi lewat window.RunNowServer. */
KIND.brandcfg = function (g, it) {
  var S2 = window.RunNowServer;
  var row = el("div", "row col");
  if (!S2 || !S2.brand) return row;
  var lb = el("div", "lb"); lb.appendChild(el("b", "", "Nama, ikon, splash, dan badge dari server"));
  var info = el("small", "", ""); lb.appendChild(info); row.appendChild(lb);
  function yn(v) { return v ? "ada" : "tidak ada (pakai bawaan)"; }
  function draw() {
    var b = {};
    try { b = JSON.parse(S2.brand()); } catch (e) {}
    info.textContent = b.ok
      ? "Nama: " + (b.name || "-") + ". Ikon: " + yn(b.hasIcon) + ". Splash: " + yn(b.hasSplash) + ". Badge notifikasi: " + yn(b.hasBadge) + "."
      : "Belum diambil dari server. Dibaca dari manifest.webmanifest di URL di atas.";
  }
  draw();
  var rf = el("button", "btn sm", "Ambil ulang dari server"); rf.type = "button";
  rf.onclick = function () {
    rf.disabled = true; rf.textContent = "Mengambil\u2026";
    S2.brandRefresh();
  };
  window.onBrandUpdated = function () {
    rf.disabled = false; rf.textContent = "Ambil ulang dari server";
    draw();
    var b = {};
    try { b = JSON.parse(S2.brand()); } catch (e) {}
    toast(b.ok ? "Nama, ikon, splash, dan badge diperbarui dari server." : "Gagal mengambil manifest dari server.", !b.ok);
  };
  var pin = el("button", "btn g", "Pasang pintasan di layar utama"); pin.type = "button";
  pin.onclick = function () {
    var r = S2.brandPin();
    if (r === "ok") toast("Konfirmasi pemasangan pintasan muncul di layar.");
    else if (r === "no-brand") toast("Ambil dari server dulu.", true);
    else if (r === "unsupported") toast("Peluncur HP ini tidak mendukung pintasan.", true);
    else toast("Pintasan gagal dipasang.", true);
  };
  var rs = el("button", "btn g", "Hapus data dari server (kembali ke bawaan)"); rs.type = "button";
  rs.onclick = function () { S2.brandReset(); draw(); toast("Kembali ke nama, ikon, splash, dan badge bawaan."); };
  row.appendChild(rf); row.appendChild(pin); row.appendChild(rs);
  row.appendChild(el("small", "", "Splash, badge notifikasi, dan nama/ikon di layar Recents langsung mengikuti server. Ikon peluncur dan nama di daftar aplikasi dibuat Android saat dipasang dan tidak bisa diubah dari dalam aplikasi; pintasan di atas memberi nama + ikon dari server.")).style.color = "var(--mt)";
  return row;
};

function renderList() {
  document.title = "Pengaturan"; $("ttl").textContent = "Pengaturan";
  var m = $("m"); m.textContent = "";
  m.appendChild(el("p", "sub", "Pengaturan yang berhubungan dengan jam Huawei."));
  var sheet = el("div", "sheet");
  G.forEach(function (g) {
    var b = el("button", "go"); b.type = "button";
    var t = el("div", "t"); t.appendChild(el("b", "", g.title)); t.appendChild(el("small", "", g.sub));
    b.appendChild(t);
    b.onclick = function () { go(g.id); };
    sheet.appendChild(b);
  });
  m.appendChild(sheet);
}

function renderGroup(g) {
  $("ttl").textContent = g.title; document.title = g.title;
  var m = $("m"); m.textContent = "";
  m.appendChild(el("p", "sub", g.sub));
  var sheet = el("div", "sheet");
  var failed = Object.keys(S.err);
  failed.forEach(function (k) { sheet.appendChild(el("div", "note err", S.err[k])); });
  g.items.forEach(function (it) {
    if (!usable(it)) return;
    sheet.appendChild(KIND[it.t](g, it));
  });
  if (!sheet.firstChild) sheet.appendChild(el("div", "load", "Tidak ada pengaturan yang bisa ditampilkan."));
  m.appendChild(sheet);
}

function show() {
  var my = ++token, g = group(cur);
  setBusy(false);
  if (!g) { cur = ""; renderList(); return; }
  $("ttl").textContent = g.title;
  var m = $("m"); m.textContent = ""; m.appendChild(el("div", "load", "Memuat\u2026"));
  loadData(g).then(function () { if (my === token) renderGroup(g); });
}

function go(id) {
  cur = id || "";
  try { history.replaceState(null, "", cur ? "#" + cur : location.pathname + location.search); } catch (e) {}
  show();
}

/* Tombol Back di aplikasi: dari kelompok kembali ke daftar; dari daftar biarkan aplikasi menutup layar ini. */
window.nativeBack = function () { if (cur) { go(""); return true; } return false; };
$("back").onclick = function () {
  if (cur) go(""); else rn("openScreen", ["/"]).catch(function () {});
};
window.addEventListener("hashchange", function () {
  var id = location.hash.replace(/^#/, "");
  if (id !== cur) { cur = /^[a-z0-9-]{1,30}$/.test(id) ? id : ""; show(); }
});
(function () {
  var id = location.hash.replace(/^#/, "");
  cur = /^[a-z0-9-]{1,30}$/.test(id) ? id : "";
  show();
})();
</script>
