<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Pengaturan</title>
<style>
:root{--bg:#f2f4f8;--cd:#ffffff;--tx:#0b0d12;--pr:#0077c8;--ok:#12b76a;--wn:#c47a06;--bad:#d4372f;
--mt:color-mix(in srgb,var(--tx) 66%,var(--bg));--ln:color-mix(in srgb,var(--tx) 12%,var(--bg));
--ps:color-mix(in srgb,var(--pr) 14%,var(--cd));--el:color-mix(in srgb,var(--tx) 5%,var(--cd));--r:18px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--ok:#32d583;--wn:#fdb022;--bad:#ff6b6b;color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;max-width:560px;padding:0 14px 40px;background:var(--bg);color:var(--tx);
font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--pr);outline-offset:2px}

#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:6px;
padding:10px 0;background:var(--bg)}
#back{width:44px;height:44px;border-radius:50%;background:var(--cd);border:1px solid var(--ln);font-size:26px;line-height:1;
display:grid;place-items:center;padding-bottom:3px}
#ttl{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.2}

.sheet{background:var(--cd);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden}
.sub{color:var(--mt);font-size:14px;margin:0 2px 14px}

/* daftar kelompok */
.go{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 16px;text-align:left;border-top:1px solid var(--ln)}
.go:first-child{border-top:0}
.go .t{flex:1;min-width:0}
.go b{display:block;font-size:16px}
.go small{display:block;color:var(--mt);font-size:13px;line-height:1.35;margin-top:2px}
.go:after{content:"";flex:none;width:9px;height:9px;border-right:2.5px solid var(--mt);border-top:2.5px solid var(--mt);transform:rotate(45deg)}

/* baris pengaturan */
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 16px;border-top:1px solid var(--ln);min-height:56px}
.row:first-child{border-top:0}
.row.col{flex-direction:column;align-items:stretch;gap:10px}
.lb{flex:1;min-width:0}
.lb b{display:block;font-weight:700;font-size:15px}
.lb small{display:block;color:var(--mt);font-size:13px;line-height:1.35;margin-top:2px}
.note{padding:12px 16px;border-top:1px solid var(--ln);font-size:14px;color:var(--mt)}
.note.warn{color:var(--wn)}
.note.err{color:var(--bad)}

input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:50px;height:30px;border-radius:99px;margin:0;
background:var(--ln);position:relative;transition:background .2s}
input[type=checkbox]:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;
box-shadow:0 1px 3px #0004;transition:left .2s}
input[type=checkbox]:checked{background:var(--pr)}
input[type=checkbox]:checked:after{left:23px}
select,input[type=number],input[type=text]{min-height:46px;padding:9px 12px;border:1.5px solid var(--ln);border-radius:14px;
background:var(--bg);font-weight:600;max-width:100%}
select{flex:none;min-width:128px}
input[type=number],input[type=text]{width:100%}
.inline{display:flex;gap:8px;align-items:center}
.btn{min-height:46px;padding:10px 16px;border-radius:14px;background:var(--pr);color:var(--cd);font-weight:700;text-align:center}
:root[data-theme=dark] .btn{color:var(--bg)}
.btn.g{background:var(--el);color:var(--tx);border:1px solid var(--ln)}
.btn.dg{background:var(--bad);color:#fff}
.btn:disabled{opacity:.6}
.btn.sm{flex:none}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.frm{display:flex;flex-direction:column;gap:8px}
.fld{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px}
.fld span{flex:1;min-width:0;font-size:14px;font-weight:600}
.fld input[type=number],.fld select{width:132px;flex:none;min-width:0}
textarea{width:100%;min-height:170px;padding:9px 12px;border:1.5px solid var(--ln);border-radius:14px;background:var(--bg);
font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.btns .btn{flex:1;min-width:120px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{min-width:40px;min-height:40px;padding:0 6px;border-radius:12px;border:1.5px solid var(--ln);background:var(--bg);font-weight:700;font-size:13px}
.days button.on{background:var(--pr);color:var(--cd);border-color:var(--pr)}
:root[data-theme=dark] .days button.on{color:var(--bg)}
input[type=time]{flex:none;min-height:46px;padding:9px 12px;border:1.5px solid var(--ln);border-radius:14px;background:var(--bg);font-weight:600}
textarea.pl{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:150px}

#m.busy .row,#m.busy .go{opacity:.6;pointer-events:none}
#toast{position:fixed;left:14px;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:532px;margin:0 auto;z-index:20;
padding:12px 16px;border-radius:14px;background:var(--tx);color:var(--bg);font-size:14px;font-weight:600;display:none}
#toast.err{background:var(--bad);color:#fff}
.load{padding:24px 16px;color:var(--mt)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header id="bar">
  <button id="back" type="button" aria-label="Kembali">&#8249;</button>
  <h1 id="ttl">Pengaturan</h1>
</header>
<main id="m"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- tema: sama dengan index.html (localStorage "la2" satu origin) ---------- */
/* Palet 26 tema: [terang, gelap], masing-masing [latar, kartu, teks, aksen]. Urutan sama dengan SKINS di index.html. */
var PALET = [[["#f5f2eb","#ffffff","#1b2b29","#0f766e"],["#0e1514","#162220","#e6f0ee","#2dd4bf"]],[["#e8e8e6","#f6f6f4","#0b0b0b","#d71921"],["#000000","#121212","#f4f4f2","#ff3b30"]],[["#f4f0e8","#fffaf0","#29251f","#b85c38"],["#1a1612","#241e18","#f1e9dc","#e08a63"]],[["#e8f1fb","#ffffff","#0b2540","#0a7fd4"],["#071b33","#102746","#eaf4ff","#42b7ff"]],[["#f1effc","#ffffff","#241f45","#6d4bd0"],["#101827","#1b2638","#e8f0ff","#9d8cff"]],[["#fff5f6","#ffffff","#482b36","#e65385"],["#1f1218","#2b1a22","#ffe9f0","#ff7aa5"]],[["#f0f5ef","#ffffff","#203b2a","#36834b"],["#0e1a12","#16261b","#e3f2e7","#5fd07f"]],[["#fff8e7","#fffdf6","#493d1d","#b18b00"],["#1a1608","#262011","#f6ecc8","#f0c53a"]],[["#f5effa","#ffffff","#2d2038","#8f43c9"],["#17131f","#251d30","#f4eaff","#d08aff"]],[["#f3f6fa","#ffffff","#182536","#3164cc"],["#0d141f","#162131","#e8f0fb","#6b9bff"]],[["#f6f2ee","#ffffff","#211a15","#d6481a"],["#151515","#202020","#f5f5f5","#ff6b35"]],[["#f7f0ff","#ffffff","#35244b","#8654cf"],["#1a1326","#261b36","#efe6ff","#b58cff"]],[["#eafaff","#ffffff","#123944","#009db8"],["#0a1c22","#112b33","#dff7fc","#2fd4ee"]],[["#f8f8f8","#ffffff","#202020","#c62828"],["#121212","#1c1c1c","#f2f2f2","#ff5a5a"]],[["#eef8f5","#ffffff","#12332c","#0f9f78"],["#101f1d","#182d29","#e8fff8","#4ce0b0"]],[["#fff4e9","#ffffff","#4c2c1b","#e16b2e"],["#1c120b","#2a1c13","#ffeadb","#ff9250"]],[["#f1f0ea","#ffffff","#20231e","#606c38"],["#141610","#1e211a","#eceee3","#a3b86a"]],[["#eef2fb","#ffffff","#142038","#3a63d1"],["#0d1528","#18233d","#eef3ff","#6f9cff"]],[["#fdf0f1","#ffffff","#47232b","#b51f4a"],["#1d1114","#2a1a1e","#fbe6ea","#ef6a8c"]],[["#e9f1ff","#f9fbff","#162e55","#3158d5"],["#0c1730","#142343","#e6eeff","#7aa0ff"]],[["#f7f4e6","#fffdf2","#2a2610","#a77d00"],["#15151a","#222229","#f2f2f7","#ffcf4a"]],[["#f3f0e9","#fffdf8","#25231e","#347d70"],["#181a19","#222524","#eeede8","#5cbfaa"]],[["#f1f5f9","#ffffff","#1f2937","#475569"],["#0f141a","#18202a","#e5eaf0","#9fb3c8"]],[["#fbeffa","#ffffff","#3a1840","#c4249b"],["#1b1024","#291833","#fff0ff","#ff65d4"]],[["#f0fff4","#ffffff","#17432c","#15803d"],["#0c1a12","#14271b","#e2fbe9","#4ade80"]],[["#f2f4f8","#ffffff","#0b0d12","#0077c8"],["#0a0a0c","#121318","#ffffff","#00f0ff"]]];
(function () {
  var s = {};
  try { s = JSON.parse(localStorage.getItem("la2") || "{}"); } catch (e) {}
  var th = s.th || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
  var i = Math.max(1, Math.min(26, Number(s.skin) || 26)) - 1;
  var c = PALET[i][th === "dark" ? 1 : 0];
  var st = document.documentElement.style;
  st.setProperty("--bg", c[0]); st.setProperty("--cd", c[1]); st.setProperty("--tx", c[2]); st.setProperty("--pr", c[3]);
  document.documentElement.dataset.theme = th;
})();

/* ---------- jembatan ke aplikasi: sama dengan rn() di index.html ---------- */
function rn(method, args, timeout) {
  return new Promise(function (res, rej) {
    var h = window.ReactNativeWebView;
    if (!h || !h.postMessage) { rej(new Error("Pengaturan jam hanya bisa diubah dari aplikasi.")); return; }
    rn.p = rn.p || {};
    var id = rn.n = (rn.n || 0) + 1;
    var t = setTimeout(function () { delete rn.p[id]; rej(new Error("Tidak ada jawaban dari aplikasi.")); }, timeout || 20000);
    rn.p[id] = { res: res, rej: rej, t: t };
    h.postMessage(JSON.stringify({ type: "rpc", id: id, method: method, args: args || [] }));
  });
}
window.__rn = function (id, ok, v) {
  var e = rn.p && rn.p[id];
  if (!e) return;
  delete rn.p[id]; clearTimeout(e.t);
  if (ok) e.res(v); else e.rej(new Error(String(v)));
};
window.__hrvTick = function (n) {
  var e = document.getElementById("hrvt");
  if (e) e.textContent = "Sisa " + n + " detik. Tetap diam.";
};

/* ---------- TABEL PENGATURAN ----------
   Satu kelompok = satu entri di G. Satu pengaturan = satu objek di items. Menambah pengaturan = menambah satu objek.

   Kelompok: id (alamat: pengaturan.html#id; daftarkan juga di Routes.kt), title, sub,
     load: { kunci: "namaMetodeGet" }  status yang dibaca saat kelompok dibuka; hasilnya ada di s.kunci
   Item (semua properti teks boleh berupa fungsi (s) => teks):
     t       jenis: switch | select | number | text | button | buttons | note | hrv
     need    daftar kunci load yang harus berhasil dibaca; kalau gagal, item disembunyikan
     vis     (s) => boolean, tampil bila true
     label, hint
     val     (s) => nilai sekarang                 (switch, select, number, text)
     m       nama metode untuk menyimpan; pre: argumen di depan nilai; into: kunci load yang diganti jawabannya;
             reload: baca ulang semua status setelah berhasil; timeout (ms); done: pesan berhasil
     opts    [[nilai, teks], ...]; num: ubah nilai pilihan ke angka     (select)
     min, max, off   batas angka; off = teks bantuan bila kosong        (number)
     ph, btn         isi bantuan dan teks tombol                        (text)
     args            argumen tetap                                      (button)
     plain           tombol sekunder                                    (button)
     list            [{label, m, args, done}]                           (buttons)
   Tambahan langkah 4:
     t: "form"      beberapa isian dalam satu simpan. fields: [{k, t: number|select|check, label, val:(s)=>nilai, min, max, step, opts}];
                     pack: (nilai {k: isi}) => satu argumen yang dikirim ke m; btn: teks tombol
     t: "report"    tombol buat laporan dukungan (getSupportReport), kotak teks, dan tombol salin
     select: nul     nilai pilihan yang dikirim sebagai null (mis. "auto")
     button: confirm teks tombol pada ketukan pertama; perlu ketukan kedua dalam 5 detik; danger: tombol merah
     done            boleh fungsi (s, jawaban) => teks
   Tambahan langkah 5:
     t: "apps"      daftar aplikasi berisi saklar, dengan kotak cari. src: kunci load berisi [{packageName,label,enabled}]; m: metode (nama paket, nyala).
                     Tiap saklar disimpan sendiri tanpa memuat ulang halaman.
     t: "lines"     kotak teks, satu isi per baris, dikirim sebagai satu daftar. val:(s)=>daftar; max, len (angka atau fungsi (s)); ph, btn
     t: "alarms"    editor alarm jam (5 slot + alarm pintar). src: kunci load berisi hasil getAlarms; m: setAlarms; into: kunci yang sama
*/
var mnt = function (n) { return n + " menit"; };
var G = [
  {
    id: "sinkron", title: "Sinkron dan latar belakang",
    sub: "Kapan data jam diambil, dan agar tetap jalan saat aplikasi ditutup.",
    load: { b: "getBackgroundStatus", r: "getBackgroundRestrictions" },
    items: [
      { t: "note", need: ["b"], text: function (s) {
          return s.b.address ? (s.b.name || "Jam") + (s.b.running ? ", berjalan" : s.b.paused ? ", dijeda" : "")
                             : "Belum ada jam yang diingat. Hubungkan jam dulu lewat Koneksi jam."; } },
      { t: "button", label: "Sinkron sekarang", m: "syncNow", timeout: 300000, done: "Sinkron selesai.", reload: true },
      { t: "switch", need: ["b"], label: "Sinkron tetap jalan saat aplikasi ditutup", hint: "Perlu izin notifikasi dan Bluetooth.",
        val: function (s) { return s.b.enabled; }, m: "setBackgroundEnabled", into: "b" },
      { t: "select", need: ["b"], label: "Sinkron tiap",
        val: function (s) { return s.b.syncIntervalMinutes; },
        opts: [15, 30, 60, 120, 240].map(function (n) { return [n, mnt(n)]; }), num: true, m: "setSyncIntervalMinutes", into: "b" },
      { t: "note", need: ["r"], warn: true, vis: function (s) { return !s.r.ignoringBatteryOptimizations; },
        text: "Android bisa menghentikan sinkron saat layar mati." },
      { t: "button", need: ["r"], plain: true, vis: function (s) { return !s.r.ignoringBatteryOptimizations; },
        label: "Buka pengaturan baterai", m: "openBatteryExemption" },
      { t: "button", need: ["r"], plain: true, vis: function (s) { return !!s.r.autoStartVendor; },
        label: function (s) { return "Buka pengaturan autostart (" + (s.r.manufacturer || "HP") + ")"; }, m: "openAutoStartSettings" },
      { t: "button", plain: true, label: "Koneksi jam", hint: "Cari jam, ikat, dan sambungkan.", m: "openScreen", args: ["/watch"] }
    ]
  },
  {
    id: "dasar", title: "Jam dan profil",
    sub: "Profil badan, zona detak, bahasa jam, dan alat bantu sambungan.",
    load: { p: "getUserProfile", z: "getHeartRateZonesStatus", lg: "getWatchLanguage", fb: "getForceBle" },
    items: [
      { t: "form", need: ["p"], label: "Profil",
        hint: function (s) { return s.p.configured ? "Dipakai jam untuk kalori dan zona detak." : "Belum diisi. Angka di bawah hanya contoh."; },
        fields: [
          { k: "heightCm", t: "number", label: "Tinggi (cm)", min: 100, max: 250, val: function (s) { return s.p.heightCm; } },
          { k: "weightKg", t: "number", label: "Berat (kg)", min: 20, max: 300, step: 0.1, val: function (s) { return s.p.weightKg; } },
          { k: "birthYear", t: "number", label: "Tahun lahir", min: 1900, max: new Date().getFullYear(), val: function (s) { return s.p.birthYear; } },
          { k: "sex", t: "select", label: "Jenis kelamin", val: function (s) { return s.p.sex; },
            opts: [["male", "Pria"], ["female", "Wanita"], ["unknown", "Tidak disebut"]] },
          { k: "dailyStepGoal", t: "number", label: "Target langkah", min: 1000, max: 100000, val: function (s) { return s.p.dailyStepGoal; } }
        ],
        pack: function (v) { return v; },
        btn: "Simpan profil", m: "setUserProfile", reload: true,
        done: function (s, r) { return r && r.sent ? "Profil tersimpan dan dikirim ke jam." : "Profil tersimpan. Dikirim saat jam tersambung."; } },

      { t: "note", need: ["z"], warn: true, vis: function (s) { return s.z.via === "none"; },
        text: "Jam ini tidak menerima zona detak dari aplikasi. Zona tetap tersimpan." },
      { t: "form", need: ["z"], label: "Zona detak jantung",
        hint: function (s) {
          var how = s.z.via ? "Jam menerima zona lewat jalur " + s.z.via + "." : "Jam belum tersambung; zona dikirim saat tersambung.";
          return (s.z.configured ? "Zona buatanmu. " : "Bawaan menurut umur di profil. ") + how + " Isi tiap zona dengan detak terendahnya."; },
        fields: [
          { k: "method", t: "select", label: "Metode", val: function (s) { return s.z.method; },
            opts: [["max", "Persen detak maksimum"], ["hrr", "Persen cadangan detak"]] },
          { k: "maxHr", t: "number", label: "Detak maksimum", min: 100, max: 219, val: function (s) { return s.z.maxHr; } },
          { k: "restingHr", t: "number", label: "Detak istirahat", min: 30, max: 110, val: function (s) { return s.z.restingHr; } },
          { k: "z1", t: "number", label: "Zona 1 mulai", min: 30, max: 219, val: function (s) { return s.z.zones[0]; } },
          { k: "z2", t: "number", label: "Zona 2 mulai", min: 30, max: 219, val: function (s) { return s.z.zones[1]; } },
          { k: "z3", t: "number", label: "Zona 3 mulai", min: 30, max: 219, val: function (s) { return s.z.zones[2]; } },
          { k: "z4", t: "number", label: "Zona 4 mulai", min: 30, max: 219, val: function (s) { return s.z.zones[3]; } },
          { k: "z5", t: "number", label: "Zona 5 mulai", min: 30, max: 219, val: function (s) { return s.z.zones[4]; } },
          { k: "warnOn", t: "check", label: "Alarm batas detak saat latihan", val: function (s) { return s.z.warningEnabled; } },
          { k: "warnAt", t: "number", label: "Batas alarm (bpm)", min: 100, max: 219, val: function (s) { return s.z.warningLimit; } }
        ],
        pack: function (v) {
          return { method: v.method, maxHr: v.maxHr, restingHr: v.restingHr, zones: [v.z1, v.z2, v.z3, v.z4, v.z5],
                   warningEnabled: v.warnOn, warningLimit: v.warnAt };
        },
        btn: "Simpan zona", m: "setHeartRateZones", reload: true,
        done: function (s, r) { return r && r.sent ? "Zona tersimpan dan dikirim ke jam." : "Zona tersimpan. Dikirim saat jam tersambung."; } },
      { t: "button", need: ["z"], plain: true, vis: function (s) { return !!s.z.configured; }, label: "Kembali ke zona bawaan",
        m: "setHeartRateZones", args: [null], reload: true, done: "Zona kembali ke bawaan." },

      { t: "select", need: ["lg"], label: "Bahasa di jam", hint: "Otomatis mengikuti bahasa HP.",
        val: function (s) { return s.lg.language || "auto"; },
        opts: [["auto", "Otomatis"], ["id", "Indonesia"], ["en", "English"]], nul: "auto", m: "setWatchLanguage", reload: true,
        done: function (s, r) { return r && r.took ? "Bahasa dikirim ke jam." : "Bahasa tersimpan. Dikirim saat jam tersambung."; } },

      { t: "button", plain: true, label: "Baca baterai jam", m: "refreshBattery", timeout: 30000,
        done: function (s, r) { return "Baterai jam: " + (r && r.level != null ? r.level + "%" : "tidak terbaca") + "."; } },
      { t: "button", plain: true, label: "Sinkron seluruh riwayat", hint: "Mengambil ulang semua data dari jam. Bisa lama.",
        m: "syncFullHistory", timeout: 900000, done: "Sinkron riwayat selesai." },
      { t: "switch", need: ["fb"], label: "Paksa Bluetooth LE", hint: "Untuk uji sambungan. Berlaku di sambungan berikutnya.",
        val: function (s) { return s.fb; }, m: "setForceBle", reload: true },

      { t: "report", label: "Laporan dukungan",
        hint: "Isi: tipe jam, perintah yang didukung, dan log sambungan. Alamat Bluetooth dan nomor seri dibuang." },

      { t: "button", plain: true, danger: true, label: "Lupakan jam ini", confirm: "Ketuk lagi untuk melupakan jam",
        hint: "Menghapus jam yang diingat. Hubungkan ulang lewat Koneksi jam.", m: "forgetDevice", done: "Jam dilupakan." }
    ]
  },
  {
    id: "cuaca", title: "Cuaca",
    sub: "Prakiraan cuaca yang dikirim ke jam.",

      return t;
    }
    function switchBox(o, label, mark) {
      var line = el("div", "fld"); line.appendChild(el("span", "", label));
      var sw = el("input"); sw.type = "checkbox"; sw.setAttribute("role", "switch"); sw.checked = o.enabled; sw.setAttribute("aria-label", label);
      sw.onchange = function () { o.enabled = sw.checked; if (mark) mark(); };
      line.appendChild(sw);
      return line;
    }
    function draw() {
      body.textContent = "";
      for (var i = 1; i <= 5; i++) (function (n) {
        var s = slots[n], row = el("div", "row col");
        if (!s) {
          var add = el("button", "btn g", "Tambah alarm " + n); add.type = "button";
          add.onclick = function () { slots[n] = { enabled: true, hour: 6, minute: 0, repeat: 0, name: "" }; draw(); };
          row.appendChild(add); body.appendChild(row); return;
        }
        row.appendChild(switchBox(s, "Alarm " + n));
        var line = el("div", "inline"); line.appendChild(timeBox(s));
        var nm = el("input"); nm.type = "text"; nm.placeholder = "Nama (boleh kosong)"; nm.maxLength = 64; nm.value = s.name;
        nm.setAttribute("aria-label", "Nama alarm " + n); nm.oninput = function () { s.name = nm.value; };
        line.appendChild(nm); row.appendChild(line);
        row.appendChild(daysBox(s));
        var del = el("button", "btn g", "Hapus alarm " + n); del.type = "button";
        del.onclick = function () { slots[n] = null; draw(); };
        row.appendChild(del);
        body.appendChild(row);
      })(i);
      if (A.smartSupported) {
        var mark = function () { touched = true; };
        var row = el("div", "row col");
        row.appendChild(labelBox({ label: "Alarm pintar", hint: "Berbunyi saat tidurmu paling ringan, dalam jendela menit sebelum waktu yang dipilih. Di jam hanya bisa dimatikan, tidak dihapus." }));
        row.appendChild(switchBox(smart, "Aktif", mark));
        row.appendChild(timeBox(smart, mark));
        row.appendChild(daysBox(smart, mark));
        var fl = el("label", "fld"); fl.appendChild(el("span", "", "Jendela (menit, 0 sampai 127)"));
        ahead = el("input"); ahead.type = "number"; ahead.inputMode = "numeric"; ahead.min = 0; ahead.max = 127; ahead.value = smart.aheadMinutes;
        ahead.setAttribute("aria-label", "Jendela alarm pintar"); ahead.oninput = mark;
        fl.appendChild(ahead); row.appendChild(fl);
        body.appendChild(row);
      }
    }
    var head = el("div", "row col");
    head.appendChild(labelBox({ label: "Alarm di jam", hint: "Tanpa hari dipilih berarti berbunyi sekali. Hapus alarm lalu Simpan menghapusnya dari jam." }));
    var sv = el("button", "btn", "Simpan ke jam"); sv.type = "button";
    sv.onclick = function () {
      var ev = [];
      for (var n = 1; n <= 5; n++) {
        var s = slots[n]; if (!s) continue;
        ev.push({ slot: n, enabled: !!s.enabled, hour: s.hour, minute: s.minute, repeat: s.repeat, name: String(s.name || "").trim().slice(0, 64) });
      }
      var sm = null;
      if (A.smartSupported && touched) {
        var ah = Number(ahead.value);
        if (ahead.value.trim() === "" || !isFinite(ah) || Math.floor(ah) !== ah || ah < 0 || ah > 127) { toast("Jendela alarm pintar: isi angka bulat 0 sampai 127.", true); ahead.focus(); return; }
        sm = { enabled: !!smart.enabled, hour: smart.hour, minute: smart.minute, repeat: smart.repeat, aheadMinutes: ah };
      }
      save(g, it, [{ event: ev, smart: sm }]);
    };
    wrap.appendChild(head); wrap.appendChild(body);
    var foot = el("div", "row col"); foot.appendChild(sv); wrap.appendChild(foot);
    draw();
    return wrap;
  },
  note: function (g, it) {
    return el("div", "note" + (it.warn ? " warn" : ""), txt(it.text));
  },
  hrv: function () {
    var row = el("div", "row col");
    row.appendChild(el("div", "lb")).appendChild(el("b", "", "HRV"));
    var res = el("p", "sub", "Ukur HRV sekitar 1 menit sambil diam."); res.id = "hrvr"; res.style.margin = "0";
    var tick = el("p", "sub", ""); tick.id = "hrvt"; tick.style.margin = "0";
    var box = el("div", "btns");
    var go = el("button", "btn", "Ukur HRV"); go.type = "button";
    var stop = el("button", "btn g", "Batalkan"); stop.type = "button";
    go.onclick = function () {
      res.textContent = "Mengukur. Tetap diam.";
      rn("measureHrv", [], 150000).then(function (r) {
        res.textContent = "HRV (rMSSD): " + Math.round(r.rmssd) + " ms, detak " + Math.round(r.heartRate) + " bpm.";
        tick.textContent = "";
      }).catch(function (e) { res.textContent = e.message; tick.textContent = ""; });
    };
    stop.onclick = function () { rn("cancelHrvMeasurement").catch(function (e) { res.textContent = e.message; }); };
    box.appendChild(go); box.appendChild(stop);
    row.appendChild(res); row.appendChild(tick); row.appendChild(box);
    return row;
  }
};

function renderList() {
  document.title = "Pengaturan"; $("ttl").textContent = "Pengaturan";
  var m = $("m"); m.textContent = "";
  m.appendChild(el("p", "sub", "Pengaturan yang berhubungan dengan jam Huawei."));
  var sheet = el("div", "sheet");
  G.forEach(function (g) {
    var b = el("button", "go"); b.type = "button";
    var t = el("div", "t"); t.appendChild(el("b", "", g.title)); t.appendChild(el("small", "", g.sub));
    b.appendChild(t);
    b.onclick = function () { go(g.id); };
    sheet.appendChild(b);
  });
  m.appendChild(sheet);
}

function renderGroup(g) {
  $("ttl").textContent = g.title; document.title = g.title;
  var m = $("m"); m.textContent = "";
  m.appendChild(el("p", "sub", g.sub));
  var sheet = el("div", "sheet");
  var failed = Object.keys(S.err);
  failed.forEach(function (k) { sheet.appendChild(el("div", "note err", S.err[k])); });
  g.items.forEach(function (it) {
    if (!usable(it)) return;
    sheet.appendChild(KIND[it.t](g, it));
  });
  if (!sheet.firstChild) sheet.appendChild(el("div", "load", "Tidak ada pengaturan yang bisa ditampilkan."));
  m.appendChild(sheet);
}

function show() {
  var my = ++token, g = group(cur);
  setBusy(false);
  if (!g) { cur = ""; renderList(); return; }
  $("ttl").textContent = g.title;
  var m = $("m"); m.textContent = ""; m.appendChild(el("div", "load", "Memuat\u2026"));
  loadData(g).then(function () { if (my === token) renderGroup(g); });
}

function go(id) {
  cur = id || "";
  try { history.replaceState(null, "", cur ? "#" + cur : location.pathname + location.search); } catch (e) {}
  show();
}

/* Tombol Back di aplikasi: dari kelompok kembali ke daftar; dari daftar biarkan aplikasi menutup layar ini. */
window.nativeBack = function () { if (cur) { go(""); return true; } return false; };
$("back").onclick = function () {
  if (cur) go(""); else rn("openScreen", ["/"]).catch(function () {});
};
window.addEventListener("hashchange", function () {
  var id = location.hash.replace(/^#/, "");
  if (id !== cur) { cur = /^[a-z0-9-]{1,30}$/.test(id) ? id : ""; show(); }
});
(function () {
  var id = location.hash.replace(/^#/, "");
  cur = /^[a-z0-9-]{1,30}$/.test(id) ? id : "";
  show();
})();
</script>
