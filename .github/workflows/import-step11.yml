name: Import RunNowNative Step 11

on:
  push:
    paths:
      - "runnow-step11.zip"
      - ".github/workflows/import-step11.yml"

permissions:
  contents: write

concurrency:
  group: import-runnow-step11
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract archive and place files in repository paths
        shell: bash
        run: |
          set -euo pipefail
          test -f runnow-step11.zip
          mkdir -p /tmp/runnow-step11
          unzip -q runnow-step11.zip -d /tmp/runnow-step11
          SOURCE="/tmp/runnow-step11/RunNowNative-main"
          test -d "$SOURCE"
          test -f "$SOURCE/settings.gradle.kts"
          rsync -a --exclude='app/polarrun.keystore' --exclude='.github/workflows/build.yml' "$SOURCE/" ./
          rm -f runnow-step11.zip
          echo "Imported files:"
          find . -type f -not -path './.git/*' | sort | wc -l
          echo "Existing build workflow and signing keystore preserved."

      - name: Commit imported project files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Import RunNowNative step 11 into project structure"
          git push
