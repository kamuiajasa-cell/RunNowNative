name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''   # default "tools platform-tools" bikin gagal: paket 'tools' sudah tidak ada
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build RunSense (web)
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Pasang RunSense sebagai halaman utama
        run: |
          mv app/src/main/assets/index.html app/src/main/assets/index-lama.html
          cp -r web/dist/. app/src/main/assets/
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RunNow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
